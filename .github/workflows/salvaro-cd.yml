name: Salvaro CD

# Builds the standalone Infisical image, pushes it to the Salvaro zot registry, and deploys it to
# the `infisical` app on coolify.salvaro.pro (secrets.salvaro.pro).
#
# Every push builds and pushes (in chunks, see the build job). Deploying is opt-in: run this workflow by hand with "deploy"
# ticked, or set the repository variable COOLIFY_AUTODEPLOY to "true" to deploy on every push.
#
# Secrets: ZOT_USERNAME, ZOT_PASSWORD (push to registry.salvaro.pro), COOLIFY_TOKEN (Coolify API).

on:
    push:
        branches:
            - feat/community-oidc-sso
    workflow_dispatch:
        inputs:
            deploy:
                description: Deploy the built image to secrets.salvaro.pro
                type: boolean
                default: false

concurrency:
    group: salvaro-cd-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    REGISTRY: registry.salvaro.pro
    IMAGE: registry.salvaro.pro/salvaro/infisical-oidc
    COOLIFY_URL: https://coolify.salvaro.pro
    COOLIFY_APP_UUID: ulw86z2ortughwvznpwigdtd

jobs:
    build:
        name: Build and push image
        runs-on: ubuntu-latest
        timeout-minutes: 90
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Compute image tag
              id: meta
              run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

            - name: Load pinned build versions
              run: grep -E '^[A-Z_]+=' build-versions.env >> "$GITHUB_ENV"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            # Built to a local OCI archive and pushed by regctl below, not by buildx: the proxy in
            # front of zot cuts any single request at about 60 seconds, and buildx uploads each layer
            # in one request. regctl splits layers into chunks that each finish well inside that.
            - name: Build image
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: Dockerfile.standalone-infisical
                  platforms: linux/amd64
                  outputs: type=oci,dest=${{ runner.temp }}/image.tar
                  tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
                  build-args: |
                      INFISICAL_CLI_VERSION=${{ env.INFISICAL_CLI_VERSION }}
                      INFISICAL_PLATFORM_VERSION=${{ steps.meta.outputs.tag }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Install regctl
              env:
                  REGCTL_VERSION: v0.11.7
                  REGCTL_SHA256: 3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc
              run: |
                  curl -fsSL -o "${RUNNER_TEMP}/regctl" \
                    "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
                  echo "${REGCTL_SHA256}  ${RUNNER_TEMP}/regctl" | sha256sum --check
                  chmod +x "${RUNNER_TEMP}/regctl"

            - name: Push to registry.salvaro.pro in chunks
              env:
                  ZOT_USERNAME: ${{ secrets.ZOT_USERNAME }}
                  ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
                  TAG: ${{ steps.meta.outputs.tag }}
              run: |
                  regctl="${RUNNER_TEMP}/regctl"
                  printf '%s' "${ZOT_PASSWORD}" | "$regctl" registry login "${REGISTRY}" -u "${ZOT_USERNAME}" --pass-stdin
                  "$regctl" registry set "${REGISTRY}" --blob-chunk 16777216 --blob-max 16777216
                  "$regctl" image import "${IMAGE}:${TAG}" "${RUNNER_TEMP}/image.tar"
                  "$regctl" image copy "${IMAGE}:${TAG}" "${IMAGE}:community-oidc-sso"
                  "$regctl" manifest head "${IMAGE}:${TAG}"

    deploy:
        name: Deploy to secrets.salvaro.pro
        needs: build
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.COOLIFY_AUTODEPLOY == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Point the Coolify app at the new image
              env:
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
                  TAG: ${{ needs.build.outputs.tag }}
              run: |
                  curl --fail-with-body -sS -X PATCH \
                    -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "{\"docker_registry_image_name\":\"${IMAGE}\",\"docker_registry_image_tag\":\"${TAG}\"}" \
                    "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}"

            - name: Trigger deployment
              env:
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  curl --fail-with-body -sS \
                    -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                    "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}"

            - name: Wait for the app to report healthy
              run: |
                  for attempt in $(seq 1 60); do
                    if curl -fsS https://secrets.salvaro.pro/api/status > /dev/null; then
                      echo "secrets.salvaro.pro is healthy"
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "secrets.salvaro.pro did not become healthy within 10 minutes" >&2
                  exit 1
